<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luitwin Mallmann Data Science</title>
  <script>
    (function () {
      var saved = null;

      try {
        saved = localStorage.getItem('siteLanguage');
      } catch (error) {
        saved = null;
      }

      window.location.replace(saved === 'en' ? 'en/index.html' : 'de/index.html');
    })();
  </script>
</head>
<body>
  <p>Weiterleitung… <a href="de/index.html">Deutsch</a> | <a href="en/index.html">English</a></p>
</body>
</html>
